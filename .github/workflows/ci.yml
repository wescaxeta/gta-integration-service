name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: soap, pdo_pgsql

jobs:
  quality:
    name: Estilo + análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHP-CS-Fixer (PER-CS)
        run: composer cs

      - name: PHPStan (nível max)
        run: composer analyse -- --error-format=github

  tests:
    name: Testes (unitários, integração e PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gta_test
          POSTGRES_USER: gta
          POSTGRES_PASSWORD: gta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gta -d gta_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DB_DSN: pgsql:host=localhost;port=5432;dbname=gta_test
      TEST_DB_USER: gta
      TEST_DB_PASSWORD: gta
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: PHPUnit com cobertura
        run: vendor/bin/phpunit --testdox --coverage-text --only-summary-for-coverage-text | tee phpunit.log

      - name: Resumo de cobertura
        run: |
          echo '### Cobertura de testes' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A4 'Summary:' phpunit.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Ponta a ponta (Docker Compose)
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build e dependências
        run: |
          docker compose build
          docker compose run --rm --no-deps api composer install --no-progress --no-dev --optimize-autoloader

      - name: Sobe API, mock SOAP e PostgreSQL
        run: |
          docker compose up -d --wait
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done

      - name: Smoke test
        run: sh tests/smoke.sh http://localhost:8080

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
